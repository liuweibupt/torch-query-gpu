[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-query-gpu"
version = "0.1.0"
description = "TQP-style TPC-H query execution prototype from DuckDB-planned SQL to PyTorch tensors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Liu" }]
dependencies = [
  "duckdb>=1.2.0,<1.3.0",
  "torch>=2.2.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
tpch-torch-gen-sf1 = "scripts.gen_sf1:main"
tpch-torch-run = "scripts.run_query:main"
tpch-torch-validate = "scripts.validate_query:main"
tpch-torch-probe-substrait = "scripts.probe_substrait:main"

[tool.setuptools]
packages = [
  "tpch_torch",
  "tpch_torch.backend",
  "tpch_torch.frontend",
  "tpch_torch.ir",
  "tpch_torch.queries",
  "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
